<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icône JeuClaude : une pièce d'or au-dessus de « Ma rue » (maison, média, banque), ciel du soir. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34466b"/>
      <stop offset="0.7" stop-color="#1f2a3f"/>
      <stop offset="1" stop-color="#161e2e"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a83a"/>
    </linearGradient>
    <clipPath id="cadre">
      <rect x="8" y="8" width="240" height="240" rx="48"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#ciel)"/>
  <g clip-path="url(#cadre)">
    <!-- maison -->
    <polygon points="18,192 54,162 90,192 90,240 18,240" fill="#0f1522"/>
    <rect x="36" y="200" width="16" height="16" rx="2" fill="#f28c5b"/>
    <rect x="60" y="200" width="16" height="16" rx="2" fill="#ffb547"/>
    <!-- média -->
    <rect x="98" y="178" width="60" height="62" fill="#0f1522"/>
    <rect x="106" y="186" width="44" height="10" rx="2" fill="#ff6fa8"/>
    <rect x="108" y="204" width="14" height="14" rx="2" fill="#ffb547"/>
    <rect x="134" y="204" width="14" height="14" rx="2" fill="#ffb547" fill-opacity="0.55"/>
    <!-- banque -->
    <polygon points="164,190 202,168 240,190" fill="#0f1522"/>
    <rect x="166" y="190" width="72" height="50" fill="#0f1522"/>
    <rect x="174" y="198" width="8" height="30" fill="#c9a24a"/>
    <rect x="190" y="198" width="8" height="30" fill="#c9a24a"/>
    <rect x="206" y="198" width="8" height="30" fill="#c9a24a"/>
    <rect x="222" y="198" width="8" height="30" fill="#c9a24a"/>
    <!-- rue -->
    <rect x="0" y="228" width="256" height="28" fill="#0b101a"/>
    <rect x="30" y="238" width="22" height="4" rx="2" fill="#2e3b55"/>
    <rect x="117" y="238" width="22" height="4" rx="2" fill="#2e3b55"/>
    <rect x="204" y="238" width="22" height="4" rx="2" fill="#2e3b55"/>
  </g>
  <!-- pièce -->
  <circle cx="128" cy="96" r="62" fill="#0f1522" fill-opacity="0.35"/>
  <circle cx="128" cy="92" r="60" fill="url(#or)" stroke="#b8862b" stroke-width="6"/>
  <circle cx="128" cy="92" r="46" fill="none" stroke="#b8862b" stroke-width="3" stroke-opacity="0.7"/>
  <polyline points="98,116 116,98 130,106 158,72" fill="none" stroke="#7a4f12" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="162,62 166,86 144,74" fill="#7a4f12"/>
  <ellipse cx="108" cy="58" rx="16" ry="7" fill="#ffffff" fill-opacity="0.35" transform="rotate(-28 108 58)"/>
</svg>
